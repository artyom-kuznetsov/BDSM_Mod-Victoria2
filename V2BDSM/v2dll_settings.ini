; Настройки V2DLL. 1 = включено, 0 = выключено.
; Правится вручную, без пересборки DLL - изменения
; применяются при следующем запуске игры.

ENABLE_LOG=1                 ; лог в v2dll.log (много записей на тик, для раздачи ставить 0)
ENABLE_BUTTONS=1             ; кнопки, запускающие решения
ENABLE_DECISION_FILTER=1     ; скрытие решений из окна политики
ENABLE_PRICE_DELTA=1         ; процентный шаг изменения цен
ENABLE_POP_DISPLAY=0         ; общее население в верхней панели (экспериментально)
ENABLE_VERSION_LABEL=1       ; версия мода в подписи главного меню

; --- Байтовые правки exe (список = таблица EXE_PATCHES в
; V2TechButton.cpp, там же подробное описание каждого патча) ---
PATCH_ALWAYS_ADD_WARGOALS=1
PATCH_LAND_REINFORCE=1
PATCH_NAVAL_REINFORCE=1
PATCH_MAX_RELATIVE_PRICE=1
PATCH_CONSCIOUSNESS_PLURALITY_GROWTH=1
PATCH_ALLIED_REINFORCE_150=1
PATCH_BUILD_FACTORY_IGNORE_COLONIAL_1=1
PATCH_BUILD_FACTORY_IGNORE_COLONIAL_2=1
PATCH_BUILD_FACTORY_BUTTON_ENABLE_IGNORE_COLONIAL=1
PATCH_LOCAL_SUPPLY_FACTORY_IGNORE_COLONIAL=1
PATCH_BUILD_FACTORY_IGNORE_UNCIVILIZED_BUTTON=1
PATCH_BUILD_FACTORY_CHECKLIST_UNCIVILIZED_OWN=1
PATCH_BUILD_FACTORY_CHECKLIST_UNCIVILIZED_OTHER=1
PATCH_BUILD_FACTORY_IGNORE_UNCIVILIZED_CAN_BUILD=1

; --- Отдельные хуки exe (не из таблицы выше) ---
PATCH_OCCUPIED_REINFORCE_SPLIT=1   ; своя ставка пополнения occupied vs allied (уточняет ALLIED_REINFORCE_150)
PATCH_ALLY_OWNER_CHECK=1           ; своя ставка occupied-by-ally vs owned-by-ally (уточняет OCCUPIED_REINFORCE_SPLIT)
PATCH_GRAPH_POINT_CLAMP=1          ; кламп точек графика бюджета - чинит краш переполнения буфера, выключать не рекомендуется
PATCH_FACTORY_DUMP_SCAN=1          ; фоновый поток, дампящий в лог память отслеживаемых фабрик (диагностика, на геймплей не влияет)
PATCH_PROD_LIST_VISIBILITY=1       ; видимость строк списка "Фабрики" (нужен кнопке "скрыть колонии")
PATCH_PROD_TYPE_GATE=1             ; гейт по production_types.txt для PATCH_LOCAL_SUPPLY_FACTORY_IGNORE_COLONIAL

; ВАЖНО: если включён любой из PATCH_BUILD_FACTORY_IGNORE_UNCIVILIZED_*
; выше, держите PATCH_CIVILIZE_NULL_CHECK тоже включённым - это патч,
; который чинит краш игры при цивилизации страны (0xc0000005), а не
; независимая настройка. Без него краш вернётся, как только
; нецивилизованная страна с построенной фабрикой цивилизуется.
PATCH_CIVILIZE_NULL_CHECK=1

; --- Разброс броска в бою ---
; Работает, только если exe уже несёт "пещеру" от стороннего
; Vic2_Roll_Changer.py (это ваш случай - вы уже запускали его
; раньше с 2-5, наш патч просто перезаписывает эти же байты
; на лету при каждом запуске игры). Если exe никогда не был
; пропатчен этим скриптом, сигнатура не совпадёт и PATCH_COMBAT_ROLL
; тихо пропустится - см. лог.
; COMBAT_ROLL_MIN должен быть 0..127, COMBAT_ROLL_MAX >= MIN.
PATCH_COMBAT_ROLL=1
COMBAT_ROLL_MIN=0
COMBAT_ROLL_MAX=4
